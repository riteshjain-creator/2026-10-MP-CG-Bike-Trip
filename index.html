<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger's Run — BLR → CG → MP → Indore 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#E74C3C;--c2:#E67E22;--c3:#F39C12;--c4:#2ECC71;
  --c5:#1ABC9C;--c6:#3498DB;--c7:#9B59B6;--c8:#E91E63;
  --c9:#00BCD4;--c10:#795548;
  --bg:#12121e;--sur:#1a1a2e;--sur2:#1e2240;--sur3:#252845;
  --txt:#e0e0e0;--txt2:#8888aa;--bdr:#2a2a45;
  --ok:#2ecc71;--warn:#f39c12;--danger:#e74c3c;
  --sh:56px;--lw:220px;--rw:330px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;
  display:flex;flex-direction:column}

/* ── STATS BAR ── */
#sbar{height:var(--sh);background:var(--sur);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;
  font-size:12px;overflow-x:auto;white-space:nowrap}
#sbar .logo{font-weight:800;font-size:14px;color:#fff;letter-spacing:-0.3px}
.ver{font-size:9px;color:var(--txt2);font-weight:400;margin-left:4px}
.ssep{width:1px;height:28px;background:var(--bdr);flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.sv{font-size:14px;font-weight:700;color:var(--ok)}
.sv.w{color:var(--warn)}.sv.d{color:var(--danger)}
.sl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px}
.presets{margin-left:auto;display:flex;gap:6px;flex-shrink:0;align-items:center}
.pb{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;
  border:1px solid var(--bdr);background:transparent;color:var(--txt2);
  cursor:pointer;transition:all .2s}
.pb:hover,.pb.on{background:var(--sur3);color:#fff;border-color:#555}

/* ── MAIN ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── LEFT PANEL ── */
#lp{width:var(--lw);background:var(--sur);border-right:1px solid var(--bdr);
  overflow-y:auto;flex-shrink:0}
.ptitle{padding:10px 12px 8px;font-size:10px;font-weight:700;color:var(--txt2);
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bdr)}
.drow{padding:9px 12px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .15s}
.drow:hover,.drow.act{background:var(--sur2)}
.dhdr{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.ddot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dnum{font-size:11px;font-weight:700;color:#fff}
.ddate{font-size:10px;color:var(--txt2)}
.dwarn{font-size:11px;margin-left:auto}
.droute{font-size:11px;color:var(--txt);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:10px;color:var(--txt2);line-height:1.5}
.dkm{font-weight:600}.dkm.w{color:var(--warn)}.dkm.d{color:var(--danger)}
.dbuf{font-size:9px;font-weight:700;color:#4fc3f7;background:rgba(79,195,247,.12);
  padding:1px 5px;border-radius:3px;margin-right:3px}

/* ── MAP ── */
#mc{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%}

/* ── RIGHT PANEL ── */
#rp{width:var(--rw);background:var(--sur);border-left:1px solid var(--bdr);
  overflow-y:auto;flex-shrink:0;position:relative}
.shdr{padding:7px 12px;font-size:10px;font-weight:700;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.8px;background:var(--sur2);
  border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:2}
.shkm{font-size:11px;font-weight:600;color:var(--txt)}
.shkm.w{color:var(--warn)}.shkm.d{color:var(--danger)}
.acard{padding:9px 12px;border-bottom:1px solid var(--bdr)}
.ar1{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.achk{width:14px;height:14px;cursor:pointer;flex-shrink:0;accent-color:var(--ok)}
.aname{font-size:12px;font-weight:600;color:#fff;flex:1;cursor:pointer;line-height:1.3}
.aname.off{color:var(--txt2)}
.dbadge{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;
  cursor:pointer;border:none;color:#fff;flex-shrink:0}
.dbadge:hover{filter:brightness(1.2)}
.ar2{display:flex;align-items:center;gap:5px;padding-left:21px;margin-bottom:3px}
.tb{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600}
.t1{background:#1a4d2e;color:#5dde8a}.t2{background:#4d3800;color:#e0a000}
.t3{background:#4d1111;color:#e06060}
.amet{font-size:10px;color:var(--txt2)}
.alink{font-size:11px;color:#6aabf0;text-decoration:none;margin-left:auto}
.alink:hover{text-decoration:underline}
.adesc{font-size:11px;color:var(--txt2);padding-left:21px;line-height:1.45}

/* ── DAY PICKER ── */
.dpicker{position:absolute;right:12px;background:#252845;border:1px solid var(--bdr);
  border-radius:6px;padding:8px;z-index:50;min-width:210px;
  box-shadow:0 6px 20px rgba(0,0,0,.6)}
.dptitle{font-size:9px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.dpopts{display:flex;flex-wrap:wrap;gap:4px}
.dpopt{padding:3px 7px;border-radius:3px;font-size:10px;font-weight:700;
  cursor:pointer;color:#fff;border:none;transition:filter .15s}
.dpopt:hover{filter:brightness(1.2)}
.dpopt.cur{outline:2px solid #fff;outline-offset:1px}
.dpkm{font-size:9px;color:var(--txt2);margin-top:6px}

/* ── OVERLAY: covers map, clicking closes detail ── */
#obk{position:fixed;top:var(--sh);left:var(--lw);right:var(--rw);bottom:0;
  background:rgba(0,0,0,.35);z-index:200;display:none;cursor:pointer}

/* ── DAY DETAIL: exactly replaces right panel ── */
#dd{position:fixed;top:var(--sh);right:0;bottom:0;width:var(--rw);
  background:var(--sur);border-left:2px solid var(--bdr);overflow-y:auto;
  z-index:201;display:none}
.ddhdr{padding:14px 18px;background:var(--sur2);border-bottom:1px solid var(--bdr);
  display:flex;justify-content:space-between;align-items:flex-start}
.ddtitle{font-size:17px;font-weight:800;color:#fff}
.ddsub{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.5}
.ddx{background:none;border:none;color:var(--txt2);font-size:18px;cursor:pointer;
  padding:3px 7px;border-radius:4px}
.ddx:hover{color:#fff;background:var(--bdr)}
.crit{margin:14px 18px 0;padding:11px 13px;background:rgba(243,156,18,.12);
  border-left:3px solid var(--warn);border-radius:4px}
.bufbox{margin:14px 18px 0;padding:11px 13px;background:rgba(79,195,247,.1);
  border-left:3px solid #4fc3f7;border-radius:4px}
.buftitle{font-size:10px;font-weight:700;color:#4fc3f7;margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.6px}
.crittitle{font-size:10px;font-weight:700;color:var(--warn);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.6px}
.crittext{font-size:12px;color:var(--txt);line-height:1.6}
.ddsec{margin:14px 18px 0}
.ddsectitle{font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:9px;border-bottom:1px solid var(--bdr);padding-bottom:4px}
.si{display:flex;gap:10px;margin-bottom:10px}
.stime{font-size:11px;color:var(--txt2);width:58px;flex-shrink:0;padding-top:2px}
.scnt .sname{font-size:13px;font-weight:600;color:#fff}
.scnt .ssub{font-size:11px;color:var(--txt2);margin-top:2px;line-height:1.45}
.irow{display:flex;gap:8px;margin-bottom:8px}
.iico{font-size:13px;flex-shrink:0;margin-top:1px}
.itxt{font-size:12px;color:var(--txt);line-height:1.5}
.pb2item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;
  background:rgba(231,76,60,.1);border-radius:4px;margin-bottom:5px;border:1px solid rgba(231,76,60,.2)}
.pb2name{font-size:12px;font-weight:600;color:#fff}
.pb2sub{font-size:10px;color:var(--txt2);margin-top:2px}
.pb2sub a{color:#6aabf0;text-decoration:none}
.pb2sub a:hover{text-decoration:underline}
.ddnav{display:flex;gap:8px;margin:18px 18px 0;padding-bottom:24px}
.ddnbtn{flex:1;padding:8px;border-radius:5px;font-size:12px;font-weight:600;
  border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);cursor:pointer;text-align:center}
.ddnbtn:hover{background:var(--sur3);color:#fff}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--sur)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}

/* ── MOBILE ── */
@media(max-width:768px){
  #lp,#rp{display:none}
  #dd{width:100%}
  #mobnav{display:flex!important}
}
#mobnav{display:none;background:var(--sur);border-top:1px solid var(--bdr);
  position:fixed;bottom:0;left:0;right:0;z-index:100}
.mtab{flex:1;padding:10px 0;font-size:11px;font-weight:600;color:var(--txt2);
  cursor:pointer;border:none;background:none;text-align:center}
.mtab.on{color:var(--ok)}
</style>
</head>
<body>

<!-- STATS BAR -->
<div id="sbar">
  <div class="logo">🏍️ Tiger's Run &nbsp;·&nbsp; BLR→Indore 2026<span class="ver">v1.3</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv" id="statkm">—</span><span class="sl">Total km</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv" id="statdays">10</span><span class="sl">Days</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv" id="statadd">—</span><span class="sl">Avg km/day</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv" id="stathrs">—</span><span class="sl">Total ride hrs</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv">Oct 11–20</span><span class="sl">Dates</span></div>
  <div class="ssep"></div>
  <div class="stat"><span class="sv">🌅 5:52pm</span><span class="sl">Sunset (Oct)</span></div>
  <div class="presets">
    <span class="sl" style="align-self:center;margin-right:2px">SHOW:</span>
    <button class="pb" onclick="applyPreset('cg')" title="CG focus — Gadchiroli, Dantewada, Chitrakote, Tirathgarh, Kotumsar, Ratanpur">CG Only</button>
    <button class="pb" onclick="applyPreset('mp')" title="MP focus — Bandhavgarh, Bhedaghat, Pachmarhi, Bhimbetka, Sanchi, Ujjain, Omkareshwar, Mandu, Maheshwar">MP Only</button>
    <button class="pb on" onclick="applyPreset('both')" title="All major attractions across both states (recommended)">All Attractions ★</button>
  </div>
</div>

<!-- MAIN 3-PANEL -->
<div id="main">
  <div id="lp"><div class="ptitle">Day Timeline</div><div id="daylist"></div></div>
  <div id="mc"><div id="map"></div></div>
  <div id="rp"><div class="ptitle">Attractions &amp; Detours</div><div id="attrlist"></div></div>
</div>

<!-- OVERLAY (map dimmer — click to close detail) -->
<div id="obk" onclick="closeDD()"></div>
<div id="dd"><div id="ddcontent"></div></div>

<!-- MOBILE NAV -->
<div id="mobnav">
  <button class="mtab on" onclick="mobTab('map',this)">🗺️ Map</button>
  <button class="mtab" onclick="mobTab('days',this)">📅 Days</button>
  <button class="mtab" onclick="mobTab('attr',this)">📍 Places</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DC=['#E74C3C','#E67E22','#F39C12','#2ECC71','#1ABC9C','#3498DB','#9B59B6','#E91E63','#00BCD4','#795548'];

const DAYS=[
{n:1,date:'Oct 11 (Sun)',from:'Bangalore',to:'Nagpur',bkm:1075,night:'Nagpur',duskOk:true,warn:true,buffer:false,
 crit:'No buffer on this 1,075km day. Hard decision point at Hyderabad (km ~570, ~3pm): if delayed by rain or breakdown, night at Hyderabad and resume Day 2 from there.\n\nBoothpur stretch after Jadcherla is patchy. Speed breakers post-Karnataka border are unmarked — hazardous at night. Do not ride past 8pm.',
 sched:[
  {t:'4:00am',n:'🚀 Depart Bangalore',s:'NH44 North. Fill tank. Leave before traffic.'},
  {t:'~7:30am',n:'Kurnool area',s:'~270km. First fuel stop. Boothpur rough stretch ahead.'},
  {t:'~11:30am',n:'⚠️ Hyderabad — Decision Point',s:'570km done. If any delay, night here. Otherwise continue.'},
  {t:'~3:30pm',n:'🏍️ Wardha / Amravati area',s:'Push on. Good NH.'},
  {t:'~6:30pm',n:'🏁 Nagpur',s:'1,075km. Night halt.'},
 ],
 road:['⛽ Fuel: NH44 well-served. No dead zones.','📶 Connectivity: Good throughout.','⚠️ Boothpur stretch (Jadcherla area): rough, narrow.','🌧️ Oct: Rain possible near BLR. NH44 handles well.'],
 food:[
  {name:'Kurnool bypass — highway dhabas',type:'food',km:270},
  {name:'Hyderabad — Hotel Shadab or any café (decision point)',type:'food',km:570},
  {name:'Wardha — roadside dhaba',type:'food',km:870},
  {name:'Nagpur — Saoji or Central India Hotel',type:'food',km:1075}
 ],
 prebook:[]},

{n:2,date:'Oct 12 (Mon)',from:'Nagpur',to:'Jagdalpur via Gadchiroli',bkm:480,night:'Jagdalpur',duskOk:true,warn:true,buffer:false,
 crit:'SECURITY: Chandrapur→Gadchiroli→Bijapur→Jagdalpur crosses historically Naxal-affected Bijapur district (CG). Verify ground conditions in September 2026 before committing.\n\nCONTINGENCY: If advisory active, use Nagpur→Raipur (NH53, 290km)→Kanker→Jagdalpur (310km) = 600km.\n\nFUEL: Last reliable fuel at Chandrapur. ~300km gap to Jagdalpur. Carry fuel can. Fill to brim at Chandrapur.',
 sched:[
  {t:'7:00am',n:'🚀 Depart Nagpur',s:''},
  {t:'~9:00am',n:'⛽ Chandrapur',s:'150km. FILL FUEL + CARRY CAN. Last reliable fuel for 300km.'},
  {t:'~11:30am',n:'Gadchiroli',s:'150km from Chandrapur. Enter tribal forest corridor. No signal.'},
  {t:'~1:00pm',n:'🏍️ Bhamragad → Bijapur CG',s:'Dense forest. No signal. Slow state roads.'},
  {t:'~5:30pm',n:'🏁 Jagdalpur',s:'~480km. 2 nights here.'},
 ],
 road:['⛽ CARRY FUEL CAN. Fill at Chandrapur. ~300km gap.','📵 No signal from Gadchiroli onward. Download offline maps before Day 1.','⚠️ Bijapur district: verify security Sep 2026.','🌿 Highlight: Dense tribal forest, Indravati River, raw roads.'],
 food:[
  {name:'Nagpur — fill breakfast before departure',type:'food',km:0},
  {name:'Chandrapur — last proper town food',type:'food',km:150},
  {name:'CARRY PACKED FOOD — no reliable stops Gadchiroli→Jagdalpur',type:'note',km:200},
  {name:'Jagdalpur — Bastar Café or hotel restaurant',type:'food',km:480}
 ],
 prebook:[]},

{n:3,date:'Oct 13 (Tue)',from:'Jagdalpur',to:'Dantewada + Tirathgarh + Kotumsar',bkm:300,night:'Jagdalpur',duskOk:true,warn:false,buffer:false,
 crit:'COMBINED DAY: Both the south loop (Dantewada, 85km each way) and east loop (Tirathgarh+Kotumsar, 65km each way) are in one day.\n\nStart by 7am sharp. Keep Dantewada to 1.5hrs max — back to Jagdalpur by noon. Then east into Kanger Valley.\n\nKOTUMSAR: Guide + permit at gate. First-come basis. No signal inside Kanger Valley. Carry water and snacks for east loop.',

  {t:'7:00am',n:'🚀 Depart Jagdalpur south',s:'85km on NH30 to Dantewada.'},
  {t:'~9:15am',n:'🛕 Danteshwari Temple, Dantewada',s:'14th-century Shakti Peetha. Patron deity of Bastar royals. One of 52 Shakti shrines in India. 1.5hrs.'},
  {t:'~11:00am',n:'🚀 Return to Jagdalpur',s:'85km north.'},
  {t:'~12:30pm',n:'⛽ Jagdalpur — fuel + quick lunch',s:'Refuel. Quick meal. Now heading east.'},
  {t:'~1:30pm',n:'🌊 Tirathgarh Falls',s:'65km east. Tiered 91m plunge on Kanger River. Crystal-clear water. Dense forest. 1.5hrs.'},
  {t:'~3:00pm',n:'🕳️ Kotumsar Caves',s:'Near Tirathgarh. Guide at gate. Underground river, stalactites, rare blind fish. 2hrs.'},
  {t:'~6:00pm',n:'🏁 Back to Jagdalpur',s:'65km return.'},
 ],
 road:['⛽ Fuel at Jagdalpur midday. Carry water for Kanger loop.','📵 No signal in Kanger Valley. Download offline maps.','🎫 Kotumsar: guide ticket at gate. Bring torch.','⚠️ If time is tight, Kotumsar can be dropped — Tirathgarh is the highlight.'],
 food:[
  {name:'Bastar Café, Jagdalpur — early breakfast',type:'food',km:0},

  {name:'CARRY SNACKS — no vendors inside Kanger Valley',type:'note',km:240}
 ],
 prebook:[{n:'Kotumsar Caves guide',s:'Paid at gate day-of. First-come.',u:null,r:false}]},

{n:4,date:'Oct 14 (Wed)',from:'Jagdalpur',to:'Kanker via Chitrakote',bkm:240,night:'Kanker ❤️',duskOk:true,warn:false,buffer:false,
 crit:null,
 sched:[
  {t:'7:30am',n:'🚀 → Chitrakote Falls',s:'38km west. Fork off NH30.'},
  {t:'~8:30am',n:'💧 Chitrakote Falls',s:"India's widest waterfall — 300m horseshoe on the Indravati. Peak October post-monsoon flow. Parvati Caves on left bank. 2hrs."},
  {t:'~11:00am',n:'🚀 Return to Jagdalpur',s:'38km east. Fuel + quick lunch.'},

 ],

 food:[

  {name:'Quick dhaba, Jagdalpur (NH30)',type:'food',km:76},

  {name:'Kanker Palace restaurant or local eateries',type:'food',km:240}
 ],
 prebook:[{n:'Kanker accommodation',s:'Kanker Palace heritage hotel or CG Tourism rest house',u:'https://www.chhattisgarhtourism.co.in',r:true}]},

 crit:'BUFFER DAY: Built into the plan deliberately. If any of Days 2–4 went wrong (rain, breakdown, Gadchiroli reroute, illness), use today to recover. If all is well, it is a pure personal day — school, streets, people.\n\nDO NOT try to push on to Amarkantak today. Day 6 is the hardest riding day (515km) and requires a 7am start on fresh legs.',

 ],

 food:[
  {name:'Kanker Palace restaurant — sit-down meal',type:'food',km:0},
  {name:'Local dhabas on main market road',type:'food',km:0},
  {name:'Evening street food at tribal market',type:'food',km:0}
 ],
 prebook:[]},

{n:6,date:'Oct 16 (Fri)',from:'Kanker',to:'Amarkantak',bkm:515,night:'Amarkantak',duskOk:false,warn:true,buffer:false,
 crit:'KM REALITY: This day is ~515km — the longest attraction day on the trip.\n\nDARKNESS: Final 50km to Amarkantak is a ghat climb. DO NOT arrive after dark. Leave Kanker at 7:00am sharp. No exceptions.\n\nMORNING: 280km of highway (Kanker→Raipur→Bilaspur) before forest begins. Functional riding, not scenic, until Bilaspur.',
 sched:[
  {t:'7:00am',n:'🚀 Depart Kanker',s:'⚠️ Must leave by 7am to reach Amarkantak before dark.'},

const PRESETS={
  cg: new Set(['gadchiroli','dantewada','tirathgarh','kotumsar','chitrakote','ratanpur','achanakmar']),
  mp: new Set(['bandhavgarh','bhedaghat','chausath','pachmarhi','bhimbetka','sanchi','ujjain','omkareshwar','mandu','maheshwar']),
  both: new Set(['gadchiroli','dantewada','tirathgarh','kotumsar','chitrakote','ratanpur','achanakmar',
                 'amarkantak','bandhavgarh','bhedaghat','pachmarhi','bhimbetka','sanchi',
                 'ujjain','omkareshwar','mandu','maheshwar'])
};

const S={
  sel:new Set(PRESETS.both),
  adays:Object.fromEntries(ATTRS.map(a=>[a.id,a.d])),
  openDD:null,
  layers:[],
  mLayers:{},
  map:null,
  preset:'both'
};

function dayKm(n){
  const base=DAYS[n-1].bkm;
  const extra=ATTRS.filter(a=>S.adays[a.id]===n&&S.sel.has(a.id)).reduce((s,a)=>s+a.dkm*2,0);
  return base+extra;
}
function dayRideHrs(n){return Math.round(dayKm(n)/50*10)/10;}
function totalKm(){let t=0;for(let i=1;i<=10;i++)t+=dayKm(i);return t;}
function totalHrs(){return Math.round(totalKm()/50*10)/10;}
function kmCls(km,isT){return km>(isT?1300:600)?'d':km>(isT?1100:500)?'w':'';}

function initMap(){
  S.map=L.map('map',{center:[21,79],zoom:6});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(S.map);
}

function renderMap(){
  S.layers.forEach(l=>S.map.removeLayer(l));S.layers=[];
  Object.values(S.mLayers).forEach(l=>S.map.removeLayer(l));S.mLayers={};
  ROUTES.forEach((pts,i)=>{
    const p=L.polyline(pts,{color:DC[i],weight:4,opacity:0.85}).addTo(S.map);
    S.layers.push(p);
  });
  [{lat:12.97,lng:77.59,lbl:'BLR Start',d:1},{lat:21.15,lng:79.09,lbl:'Nagpur',d:2},
   {lat:22.72,lng:75.86,lbl:'Indore End',d:10}].forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{radius:9,fillColor:'#fff',color:DC[p.d-1],weight:3,fillOpacity:1}).addTo(S.map);
    m.bindTooltip(p.lbl,{permanent:false,direction:'top'});S.layers.push(m);
  });
  ATTRS.forEach(a=>{
    const on=S.sel.has(a.id);const dn=S.adays[a.id];const col=on?DC[dn-1]:'#444';
    const m=L.circleMarker([a.lat,a.lng],{
      radius:on?7:5,fillColor:col,color:on?'#fff':'#333',
      weight:1.5,fillOpacity:on?0.95:0.4,opacity:on?1:0.5
    }).addTo(S.map);
    const tierTxt=a.t===1?'on-route':a.t===2?'peel-off':'diversion';
    m.bindPopup('<div style="font-family:sans-serif;min-width:180px"><b style="font-size:13px">'+a.name+'</b><br>'
      +'<span style="font-size:11px;color:#666">Day '+dn+' &middot; '+tierTxt+'</span><br>'
      +(a.vh>0?'<span style="font-size:11px">'+a.vh+'hrs visit</span><br>':'')
      +(a.dkm>0?'<span style="font-size:11px">+'+a.dkm*2+'km detour</span><br>':'')
      +'<a href="'+a.link+'" target="_blank" style="font-size:11px;color:#3a7fd5">📖 Wikipedia →</a></div>');
    S.mLayers[a.id]=m;
  });
}

function renderTimeline(){
  const el=document.getElementById('daylist');el.innerHTML='';
  DAYS.forEach((d,i)=>{
    const km=dayKm(d.n);const hrs=dayRideHrs(d.n);const kc=kmCls(km,d.n===1);
    const div=document.createElement('div');
    div.className='drow'+(S.openDD===d.n?' act':'');
    div.onclick=()=>openDD(d.n);
    div.innerHTML=`
      <div class="dhdr">
        <div class="ddot" style="background:${DC[i]}"></div>
        <span class="dnum">Day ${d.n}</span>
        <span class="ddate">${d.date}</span>
        ${d.warn?'<span class="dwarn">⚠️</span>':''}
      </div>
      <div class="droute">${d.from} → ${d.to}</div>
      <div class="dmeta">
        <span class="dkm ${kc}">${km.toLocaleString()}km</span> · ~${hrs}h riding<br>
        ${d.buffer?'<span class="dbuf">🔵 BUFFER</span>':''}${d.night}
      </div>`;
    el.appendChild(div);
  });
}

function renderAttrs(){
  const el=document.getElementById('attrlist');el.innerHTML='';
  for(let d=1;d<=10;d++){
    const da=ATTRS.filter(a=>S.adays[a.id]===d);
    if(!da.length)continue;
    const km=dayKm(d);const hrs=dayRideHrs(d);const kc=kmCls(km,d===1);
    const h=document.createElement('div');h.className='shdr';
    h.innerHTML=`<span>Day ${d} · ${DAYS[d-1].date}</span><span class="shkm ${kc}">${km}km · ~${hrs}h</span>`;
    el.appendChild(h);
    da.forEach(a=>el.appendChild(mkCard(a)));
  }
}

function mkCard(a){
  const on=S.sel.has(a.id);const dn=S.adays[a.id];const col=DC[dn-1];
  const tl=a.t===1?'on-route':a.t===2?'peel-off':'diversion';
  const tc='t'+a.t;
  const meta=[a.vh>0?a.vh+'hrs':'',a.dkm>0?'+'+a.dkm*2+'km':''].filter(Boolean).join(' · ');
  const div=document.createElement('div');div.className='acard';div.id='c-'+a.id;
  div.innerHTML=`
    <div class="ar1">
      <input type="checkbox" class="achk" id="chk-${a.id}" ${on?'checked':''} onchange="toggleA('${a.id}',this.checked)">
      <label class="aname ${on?'':'off'}" for="chk-${a.id}">${a.name}</label>
      <button class="dbadge" style="background:${col}" onclick="openPicker('${a.id}',event)">D${dn}</button>
    </div>
    <div class="ar2">
      <span class="tb ${tc}">${tl}</span>
      ${meta?`<span class="amet">${meta}</span>`:''}
      <a class="alink" href="${a.link}" target="_blank" title="Wikipedia">📖</a>
    </div>
    <div class="adesc">${a.desc}</div>`;
  return div;
}

function openPicker(id,ev){
  ev.stopPropagation();
  document.querySelectorAll('.dpicker').forEach(e=>e.remove());
  const card=document.getElementById('c-'+id);if(!card)return;
  const attr=ATTRS.find(a=>a.id===id);const cur=S.adays[id];
  const dp=document.createElement('div');dp.className='dpicker';
  let html='<div class="dptitle">Move to day:</div><div class="dpopts">';
  DAYS.forEach((d,i)=>{
    const newKm=dayKm(d.n)+(d.n!==cur?attr.dkm*2:0);
    const kc=kmCls(newKm,d.n===1);
    html+='<button class="dpopt'+(d.n===cur?' cur':'')+'" style="background:'+DC[i]+'"'
      +' title="Day '+d.n+': ~'+newKm+'km'+(kc?' ⚠️':'')+'" onclick="setDay(\''+id+'\','+d.n+')">D'+d.n+'</button>';
  });
  html+='</div><div class="dpkm">Hover a day to see km impact</div>';
  dp.innerHTML=html;
  card.style.position='relative';card.appendChild(dp);
  setTimeout(()=>{
    document.addEventListener('click',function h(){dp.remove();document.removeEventListener('click',h);},{once:true});
  },50);
}

function openDD(n){
  S.openDD=n;
  const d=DAYS[n-1];const col=DC[n-1];const km=dayKm(n);const hrs=dayRideHrs(n);
  const kc=kmCls(km,n===1);
  let h=`<div class="ddhdr" style="border-top:4px solid ${col}">
    <div>
      <div class="ddtitle">Day ${n} &nbsp;·&nbsp; ${d.date}</div>
      <div class="ddsub">${d.from} → ${d.to}<br>
        <span class="${kc?'dkm '+kc:''}">${km.toLocaleString()}km</span>
        &nbsp;·&nbsp; ~${hrs}h riding &nbsp;·&nbsp; ${d.night}
        ${!d.duskOk?'<br><span style="color:var(--warn)">⚠️ Arrive before dark</span>':''}
      </div>
    </div>
    <button class="ddx" onclick="closeDD()">✕</button>
  </div>`;

  if(d.buffer){
    h+=`<div class="bufbox"><div class="buftitle">🔵 Buffer Day</div>
      <div class="crittext" style="font-size:11px">This day is intentionally unscheduled. Use it to recover from any earlier setback, or as a pure personal day. Do not compress it away unless absolutely necessary.</div></div>`;
  }

  if(d.crit){
    h+=`<div class="crit"><div class="crittitle">⚠️ Critique &amp; Watch-outs</div>
      <div class="crittext">${d.crit.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div></div>`;
  }

  if(d.sched.length){
    h+=`<div class="ddsec"><div class="ddsectitle">Estimated Schedule</div>`;
    d.sched.forEach(s=>{
      h+=`<div class="si"><div class="stime">${s.t}</div>
        <div class="scnt"><div class="sname">${s.n}</div>${s.s?`<div class="ssub">${s.s}</div>`:''}</div></div>`;
    });
    h+=`</div>`;
  }

  if(d.food&&d.food.length){
    h+=`<div class="ddsec"><div class="ddsectitle">⛽ Pit Stops &amp; Food</div>`;
    d.food.forEach(f=>{
      const ico=f.type==='fuel'?'⛽':f.type==='note'?'📝':'🍽️';
      h+=`<div class="irow"><div class="iico">${ico}</div>
        <div class="itxt">${f.name}${f.km>0?` <span style="color:var(--txt2);font-size:10px">· ~${f.km}km</span>`:''}</div></div>`;
    });
    h+=`</div>`;
  }

  const active=ATTRS.filter(a=>S.adays[a.id]===n&&S.sel.has(a.id));
  if(active.length){
    h+=`<div class="ddsec"><div class="ddsectitle">Active Stops This Day</div>`;
    active.forEach(a=>{
      const tl=a.t===1?'🟢':a.t===2?'🟡':'🔴';
      h+=`<div class="irow" style="margin-bottom:12px">
        <div class="iico">${tl}</div>
        <div class="itxt">
          <strong style="color:#fff;font-size:13px">${a.name}</strong>
          ${a.vh?` · ${a.vh}hrs`:''}${a.dkm?` · +${a.dkm*2}km detour`:''}<br>
          ${a.desc}<br>
          <a href="${a.link}" target="_blank" style="color:#6aabf0;font-size:11px">📖 Read more →</a>
        </div></div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="ddsec"><div class="ddsectitle">Road &amp; Fuel Notes</div>`;
  d.road.forEach(r=>{h+=`<div class="irow"><div class="itxt">${r}</div></div>`;});
  h+=`</div>`;

  if(d.prebook.length){
    h+=`<div class="ddsec"><div class="ddsectitle">Pre-Booking Required</div>`;
    d.prebook.forEach(p=>{
      h+=`<div class="pb2item"><span>${p.r?'🔴':'🟠'}</span>
        <div><div class="pb2name">${p.n}</div>
        <div class="pb2sub">${p.s}${p.u?` &nbsp;·&nbsp; <a href="${p.u}" target="_blank">${p.u.replace('https://','')}</a>`:''}</div>
        </div></div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="ddnav">
    ${n>1?`<button class="ddnbtn" onclick="openDD(${n-1})">◀ Day ${n-1}</button>`:'<div></div>'}
    ${n<10?`<button class="ddnbtn" onclick="openDD(${n+1})">Day ${n+1} ▶</button>`:'<div></div>'}
  </div>`;

  document.getElementById('ddcontent').innerHTML=h;
  document.getElementById('dd').style.display='block';
  document.getElementById('obk').style.display='block';
  renderTimeline();
}

function closeDD(){
  S.openDD=null;
  document.getElementById('dd').style.display='none';
  document.getElementById('obk').style.display='none';
  renderTimeline();
}

function toggleA(id,on){
  on?S.sel.add(id):S.sel.delete(id);
  S.preset=null;
  document.querySelectorAll('.pb').forEach(b=>b.classList.remove('on'));
  render();
}

function setDay(id,n){
  S.adays[id]=n;
  document.querySelectorAll('.dpicker').forEach(e=>e.remove());
  render();
  if(S.openDD)openDD(S.openDD);
}

function applyPreset(name){
  S.sel=new Set(PRESETS[name]);
  ATTRS.forEach(a=>{S.adays[a.id]=a.d;});
  S.preset=name;
  const btns=document.querySelectorAll('.pb');
  btns.forEach(b=>b.classList.remove('on'));
  if(name==='cg')btns[0].classList.add('on');
  else if(name==='mp')btns[1].classList.add('on');
  else btns[2].classList.add('on');
  render();
}

function renderStats(){
  const t=totalKm();const h=totalHrs();
  document.getElementById('statkm').textContent=t.toLocaleString();
  document.getElementById('statadd').textContent=Math.round(t/10);
  document.getElementById('stathrs').textContent=h+'h';
}

function render(){renderStats();renderTimeline();renderAttrs();renderMap();}

function mobTab(tab,el){
  document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  ['lp','rp'].forEach(id=>{document.getElementById(id).style.display='none';});
  closeDD();
  if(tab==='days'){
    const lp=document.getElementById('lp');
    lp.style.cssText='display:block;position:fixed;inset:56px 0 50px;width:100%;z-index:150;overflow-y:auto;background:var(--sur)';
  }else if(tab==='attr'){
    const rp=document.getElementById('rp');
    rp.style.cssText='display:block;position:fixed;inset:56px 0 50px;width:100%;z-index:150;overflow-y:auto;background:var(--sur)';
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  initMap();render();
  window.addEventListener('resize',()=>S.map.invalidateSize());
  if(window.innerWidth<768)document.getElementById('mobnav').style.display='flex';
});
</script>
</body>
</html>
